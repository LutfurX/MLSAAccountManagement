    <script>
      // Automatically fit full desktop layout into mobile screen with pinch-to-zoom support (Gmail Desktop style)
      (function() {
        function autoFitDesktopOnMobile() {
          var targetWidth = 1240;
          var screenWidth = window.innerWidth;
          if (window.screen && window.screen.width) {
            var isLandscape = Math.abs(window.orientation || 0) === 90;
            var sw = isLandscape 
              ? Math.max(window.screen.width, window.screen.height) 
              : Math.min(window.screen.width, window.screen.height);
            if (sw && sw > 0) {
              screenWidth = Math.min(screenWidth || sw, sw);
            }
          }
          if (!screenWidth || screenWidth <= 0) {
            screenWidth = targetWidth;
          }

          var meta = document.querySelector('meta[name="viewport"]');
          if (!meta) {
            meta = document.createElement('meta');
            meta.name = 'viewport';
            document.head.appendChild(meta);
          }

          if (screenWidth < targetWidth) {
            var scale = Number((screenWidth / targetWidth).toFixed(4));
            meta.setAttribute(
              'content',
              'width=' + targetWidth + ', initial-scale=' + scale + ', minimum-scale=' + (scale * 0.75).toFixed(4) + ', maximum-scale=4.0, user-scalable=yes'
            );
          } else {
            meta.setAttribute('content', 'width=' + targetWidth + ', initial-scale=1.0, user-scalable=yes');
          }
        }

        autoFitDesktopOnMobile();
        window.addEventListener('resize', autoFitDesktopOnMobile);
        window.addEventListener('orientationchange', function() {
          setTimeout(autoFitDesktopOnMobile, 120);
        });
      })();
    </script>
